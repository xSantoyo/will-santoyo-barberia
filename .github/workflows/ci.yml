name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: badboys
          POSTGRES_PASSWORD: badboys
          POSTGRES_DB: badboys_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U badboys"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests unitarios (SQLite in-memory)
        run: pytest -m "not postgres" -q
      - name: Tests de integración (Postgres real, constraint anti doble-reserva)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://badboys:badboys@localhost:5432/badboys_test
        run: pytest -m postgres -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate modules and environments
        run: |
          for dir in infra/environments/dev infra/environments/prod; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
